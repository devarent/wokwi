name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository essentials
        run: |
          test -f README.md && echo "README.md ditemukan"
          test -f LICENSE && echo "LICENSE ditemukan"
          echo "Validasi struktur repository berhasil."